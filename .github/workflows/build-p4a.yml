name: Build Yemen4G APK - P4A

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            gettext \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libssl-dev \
            libtool \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade python-for-android

      - name: Install Android prerequisites
        run: |
          python -m pythonforandroid.toolchain create \
            --dist_name=yemen4g \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,requests,beautifulsoup4,pillow \
            --arch=arm64-v8a \
            --private=. \
            --package=org.yemen4g \
            --name="Yemen4G" \
            --version=1.0 \
            --android-api=35 \
            --ndk-api=24

      - name: Build APK
        run: |
          python -m pythonforandroid.toolchain apk \
            --dist_name=yemen4g \
            --bootstrap=sdl2 \
            --private=. \
            --package=org.yemen4g \
            --name="Yemen4G" \
            --version=1.0 \
            --requirements=python3,kivy,requests,beautifulsoup4,pillow \
            --arch=arm64-v8a \
            --android-api=35 \
            --ndk-api=24 \
            --permission=android.permission.INTERNET

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yemen4G-P4A
          path: |
            .buildozer/**/*.apk
            bin/*.apk
            dist/*.apk
            **/*.apk
          if-no-files-found: error
