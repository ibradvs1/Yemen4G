name: Build Yemen4G APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

  - name: Create old sdkmanager path for Buildozer
  run: |
    SDK="$ANDROID_HOME"

    echo "Android SDK: $SDK"

    mkdir -p "$SDK/tools/bin"

    SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)

    echo "Found sdkmanager:"
    echo "$SDKMANAGER"

    if [ -z "$SDKMANAGER" ]; then
      echo "ERROR: sdkmanager not found"
      exit 1
    fi

    ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

    echo "Testing sdkmanager:"
    "$SDK/tools/bin/sdkmanager" --version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            python3-pip \
            python3-virtualenv \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade buildozer

      - name: Build APK
        env:
          P4A_ACCEPT_ANDROID_SDK_LICENSE: "1"
        run: |
          ~/.local/bin/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yemen4G
          path: bin/*.apk
